name: Deploy IKABAY Local to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://luqvqwpglceeqtbbtvuo.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_URL: https://wa.me/596696653589

      - name: Prepare GitHub Pages artifact
        run: |
          printf 'ikabay.store\n' > dist/CNAME
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify production routes and assets
        run: |
          set -euo pipefail
          url="https://ikabay.store"
          html="$(curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$url/")"
          printf '%s' "$html" | grep -q 'Ikabay'
          assets="$(printf '%s' "$html" | grep -oE '(src|href)="[^" ]+.(js|css)"' | sed -E 's/^(src|href)="//; s/"$//' | sort -u)"
          test -n "$assets"
          while IFS= read -r asset; do
            asset="${asset#./}"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --head "$url/$asset" >/dev/null
          done <<< "$assets"
          for route in / /catalogue /sourcing /partenaires /contact /transport /legal; do
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors --head "$url$route" >/dev/null
          done
          echo "Production smoke test passed: homepage, assets and critical routes"
