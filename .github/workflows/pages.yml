name: Deploy IKABAY to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser for commercial smoke tests
        run: npx playwright install --with-deps chromium

      - name: Build public commercial site
        run: npm run build
        env:
          VITE_WHATSAPP_URL: https://wa.me/596696653589
          VITE_APP_NAME: IKABAY
          VITE_APP_EMAIL: sourcing@ikabay.store

      - name: Check public artifact
        run: |
          set -euo pipefail
          printf 'ikabay.store\n' > dist/CNAME
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          test ! -e dist/presentation/joel-dufeal.html
          ! grep -R -F 'Devis Final — Joël Dufeal' dist

      - name: Browser smoke tests
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/ikabay-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npx playwright test tests/commercial.spec.js --workers=1 --reporter=line

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify production routes and assets
        run: |
          set -euo pipefail
          url="https://ikabay.store"
          html="$(curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$url/")"
          printf '%s' "$html" | grep -q 'IKABAY'
          assets="$(printf '%s' "$html" | grep -oE '(src|href)="[^" ]+.(js|css)"' | sed -E 's/^(src|href)="//; s/"$//' | sort -u)"
          test -n "$assets"
          echo "Assets found:"
          printf "%s\n" "$assets"
          while IFS= read -r asset; do
            asset="${asset#./}"
            asset_path="$(printf "%s" "$asset" | sed "s#^\\./##")"
            status="$(curl --silent --show-error --location --retry 3 --retry-all-errors -o /dev/null -w "%{http_code}" "$url/$asset_path" || true)"
            echo "asset $asset_path -> $status"
            test "$status" -ge 200 2>/dev/null && test "$status" -lt 400
          done <<< "$assets"
          for route in / /catalogue /sourcing /partenaires /contact /transport /legal /devis /destockage /produit/p1; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 3 --retry-all-errors -o "$tmp" -w "%{http_code}" "$url$route" || true)"
            if { test "$status" -ge 200 2>/dev/null && test "$status" -lt 400; } && grep -q 'id="root"' "$tmp" && grep -Eq '\.(js|css)' "$tmp"; then
              echo "route $route -> $status (SPA shell valid)"
            else
              echo "route $route -> $status (invalid direct route response)"
              rm -f "$tmp"
              exit 1
            fi
            rm -f "$tmp"
          done
          legacy="$(mktemp)"
          curl --silent --show-error --location --retry 3 --retry-all-errors "$url/presentation/joel-dufeal.html" -o "$legacy" || true
          ! grep -Fq 'Devis Final — Joël Dufeal' "$legacy"
          rm -f "$legacy"
          echo "Production smoke test passed: public routes, assets and privacy checks"
