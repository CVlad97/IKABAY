name: Deploy IKABAY Local to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://luqvqwpglceeqtbbtvuo.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP_URL: https://wa.me/596696653589

      - name: Prepare GitHub Pages artifact
        run: |
          printf 'ikabay.store\n' > dist/CNAME
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify production routes and assets
        run: |
          set -euo pipefail
          url="https://ikabay.store"
          html="$(curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "$url/")"
          printf '%s' "$html" | grep -q 'Ikabay'
          assets="$(printf '%s' "$html" | grep -oE '(src|href)="[^" ]+.(js|css)"' | sed -E 's/^(src|href)="//; s/"$//' | sort -u)"
          test -n "$assets"
          echo "Assets found:"
          printf "%s\n" "$assets"
          while IFS= read -r asset; do
            asset="${asset#./}"
            asset_path="$(printf "%s" "$asset" | sed "s#^\\./##")"
            status="$(curl --silent --show-error --location --retry 3 --retry-all-errors -o /dev/null -w "%{http_code}" "$url/$asset_path" || true)"
            echo "asset $asset_path -> $status"
            test "$status" -ge 200 2>/dev/null && test "$status" -lt 400
          done <<< "$assets"
          for route in / /catalogue /sourcing /partenaires /contact /transport /legal /presentation /dossier-joel-dufeal /dossier-jules-defel; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --location --retry 3 --retry-all-errors -o "$tmp" -w "%{http_code}" "$url$route" || true)"
            if { test "$status" -ge 200 2>/dev/null && test "$status" -lt 400; } && grep -q 'id="root"' "$tmp" && grep -Eq '\.(js|css)' "$tmp"; then
              echo "route $route -> $status (SPA shell 200 valid)"
            else
              echo "route $route -> $status (invalid direct route response)"
              rm -f "$tmp"
              exit 1
            fi
            rm -f "$tmp"
          done
          for route in /presentation/joel-dufeal.html; do
            status="$(curl --silent --show-error --location --retry 3 --retry-all-errors -o /dev/null -w "%{http_code}" "$url$route" || true)"
            echo "static route $route -> $status"
            test "$status" -ge 200 2>/dev/null && test "$status" -lt 400
          done
          echo "Production smoke test passed: homepage, assets and critical routes"
